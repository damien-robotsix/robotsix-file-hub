package: robotsix_file_hub

modules:
  - id: core
    description: Core application package
    paths:
      - .gitignore
      - CHANGELOG.md
      - pyproject.toml
      - src/robotsix_file_hub/__init__.py
      - src/robotsix_file_hub/config.py
      - src/robotsix_file_hub/database.py
      - src/robotsix_file_hub/embeddings.py
      - src/robotsix_file_hub/enrichment.py
      - src/robotsix_file_hub/main.py
      - src/robotsix_file_hub/models.py
      - src/robotsix_file_hub/routes/__init__.py
      - src/robotsix_file_hub/routes/files.py
      - src/robotsix_file_hub/schemas.py
      - src/robotsix_file_hub/search.py
      - src/robotsix_file_hub/storage.py
      - src/robotsix_file_hub/tasks.py
      - tests/__init__.py
      - tests/test_download.py
      - tests/test_embeddings.py
      - tests/test_search.py
      - tests/test_tasks.py
      - tests/test_upload.py
  - id: frontend
    description: React/Vite frontend SPA
    paths:
      - frontend/.gitignore
      - frontend/.prettierrc
      - frontend/eslint.config.js
      - frontend/index.html
      - frontend/package.json
      - frontend/src/App.css
      - frontend/src/App.tsx
      - frontend/src/api.ts
      - frontend/src/index.css
      - frontend/src/main.tsx
      - frontend/src/pages/HomePage.tsx
      - frontend/src/pages/SearchPage.tsx
      - frontend/src/pages/UploadPage.tsx
      - frontend/src/vite-env.d.ts
      - frontend/tsconfig.app.json
      - frontend/tsconfig.json
      - frontend/tsconfig.node.json
      - frontend/vite.config.ts
