name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["*.*.*"]

jobs:
  docker-release:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@2de56a85055b60d0f01c406342eda081e68c0c8b
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets: inherit
