name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  # ── Python lint: ruff (doesn't need the full dependency tree) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-lint-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-lint-${{ runner.os }}-
      - name: Create virtualenv and install ruff
        run: |
          uv venv
          uv pip install ruff
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format . --check

  # ── Python type check: mypy (doesn't need the full dependency tree) ──
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-typecheck-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-typecheck-${{ runner.os }}-
      - name: Create virtualenv and install mypy
        run: |
          uv venv
          uv pip install mypy
      - name: Type check (mypy)
        run: uv run mypy --strict src/

  # ── Python tests: pytest with Postgres 16 ──
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-test-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-test-${{ runner.os }}-
      - name: Install all dependencies
        run: uv sync --all-extras --all-groups
      - name: Run tests
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

  # ── Frontend lint: ESLint + Prettier ──
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install npm dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend
      - name: Format check (Prettier)
        run: npx prettier --check .
        working-directory: frontend
