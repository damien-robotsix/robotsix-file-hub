name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# Supersede an in-flight run when a PR gets a new push; never cancel runs on
# main, so every commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The repo has 13 test files, 168 tests, a mypy-strict-clean source tree and
  # a ruff config — and until now CI ran none of it. Every PR was structurally
  # green regardless of whether the code worked, which is the quietest possible
  # failure mode: it produces no red main and no blocked tickets, so nothing in
  # the fleet ever surfaces it.
  #
  # deptry, the dependency audit (with its SARIF upload), the lockfile
  # freshness check and vulture all run here, in the reusable workflow.
  tests:
    name: Python CI
    permissions:
      contents: read  # check out the repo for the reusable Python CI
      security-events: write  # SARIF upload from the reusable audit-sarif job
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.14"
      # Must match required-version in pyproject.toml ([tool.uv]).
      uv-version: "0.12.5"
      # The tests import through `src.robotsix_file_hub...` rather than the
      # installed package, so a bare package name collects nothing ("Module
      # robotsix_file_hub was never imported"). Measured this way: 85%.
      cov-package: src/robotsix_file_hub
      coverage-threshold: "80"
      install-extras: ""
      run-deptry: true
      run-audit: true
      # Blocking SARIF audit job; uploads to code scanning on success or failure.
      audit-sarif: true
      check-lock: true
      run-vulture: true
      vulture-args: 'src/ vulture_whitelist.py --ignore-decorators "@field_validator,@model_validator"'
      # mypy --strict is clean on this repo today, so it goes in as a real gate
      # rather than a baseline ratchet.
      mypy-advisory: false

  # Pre-merge image gate: build the Dockerfile and Trivy-scan it for
  # CRITICAL/HIGH CVEs on every PR, so a broken Dockerfile or a vulnerable base
  # image is caught before merge rather than by docker-release after push.
  docker-pr-scan:
    name: docker-pr-scan
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write  # SARIF upload from the reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26 (post-v1.3.0: trivyignores, push-retries, empty Trivy-DB defaults; re-pin to v1.4.0 when ghwf #243 is released)

  # Static Dockerfile lint (hadolint) on every PR and push, complementing the
  # docker-pr-scan build/CVE gate above. Justified suppressions live inline in
  # the Dockerfile as `# hadolint ignore=` comments.
  lint-dockerfile:
    name: lint-dockerfile
    permissions:
      contents: read  # check out the repo to lint the Dockerfile
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-dockerfile.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      dockerfiles: Dockerfile

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repo to run the Alembic migrations
    # The migrations are Postgres-specific (pgvector ``CREATE EXTENSION
    # vector`` + ``vector(N)`` columns in 0002/0003), so a plain SQLite test
    # database cannot run them. Match docker-compose.yml: pgvector image with
    # file_hub/file_hub/file_hub credentials, so config/config.test.json works
    # both here and against a local ``docker compose up postgres``.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: file_hub
          POSTGRES_PASSWORD: file_hub
          POSTGRES_DB: file_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U file_hub -d file_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Must match required-version in pyproject.toml ([tool.uv]).
          version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate Alembic migrations
        env:
          # Database migrations, not the pytest suite, use this config.
          ROBOTSIX_CONFIG_FILE: config/config.test.json
        run: |
          # Apply all forward migrations against a clean database.
          uv run alembic upgrade head
          # Exercise the full downgrade path, then re-apply so CI leaves a
          # consistent schema behind.
          uv run alembic downgrade base
          uv run alembic upgrade head

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repo to check its dependencies
    # Only what the reusable Python CI does not cover: the malware-checked
    # sync (python-ci has no malware-check input) and module registration.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Must match required-version in pyproject.toml ([tool.uv]).
          version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --frozen

      - name: Validate module registration
        run: uv run robotsix-modules check-registration docs/modules.yaml --root .

  # Alias for the required `quality` status check. vulture now runs in the
  # reusable Python CI (`Python CI / Vulture (dead code)`); this job only
  # mirrors the result of the `tests` call so the `quality` context keeps
  # resolving until branch protection is switched to the python-ci context.
  quality:
    name: quality
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the reusable Python CI to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$TESTS_RESULT" = success

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repo to build and test the frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test
