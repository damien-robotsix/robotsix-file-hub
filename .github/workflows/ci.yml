name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF from the audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --frozen

      - name: Audit dependencies
        run: uv audit --frozen --output-format sarif --preview > uv-audit-results.sarif

      - name: Upload audit SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          sarif_file: uv-audit-results.sarif

      - name: Check dependency hygiene
        run: uv tool run --from deptry deptry src/
