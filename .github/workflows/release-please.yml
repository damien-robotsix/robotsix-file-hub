name: release-please

# Fleet-wide release automation per robotsix-standards release-please.md.
# Opens/updates a release PR on every push to main; creates the tag and
# GitHub Release when that release PR is merged.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  # Not in the standard's template, but without it the workflow can only be
  # exercised by landing a commit — so a misconfiguration cannot be verified
  # until after it has already failed on main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only act on a push, or on the merge of release-please's own release PR —
    # never on the merge of an unrelated PR.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    steps:
      # A release PR opened with GITHUB_TOKEN triggers no workflow runs, so its
      # required checks never report and it can never merge. Mint an App token.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped: without a permission-* input the token inherits the App's
          # blanket installation permissions (zizmor github-app, high).
          permission-contents: write        # release commit, tag, Release
          permission-pull-requests: write   # open and update the release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
        # No `release-type:` here. Passing it puts the action in non-manifest
        # mode, which ignores release-please-config.json and
        # .release-please-manifest.json — both of which this repo carries.
