name: release-please

# Fleet-wide release automation per robotsix-standards release-please.md.
# Opens/updates a release PR on every push to main; creates the tag and
# GitHub Release when that release PR is merged.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  # Not in the standard's template, but without it the workflow can only be
  # exercised by landing a commit — so a misconfiguration cannot be verified
  # until after it has already failed on main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only act on a push, or on the merge of release-please's own release PR —
    # never on the merge of an unrelated PR.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    steps:
      # A release PR opened with GITHUB_TOKEN triggers no workflow runs, so its
      # required checks never report and it can never merge. Mint an App token.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped: without a permission-* input the token inherits the App's
          # blanket installation permissions (zizmor github-app, high).
          permission-contents: write        # release commit, tag, Release
          permission-pull-requests: write   # open and update the release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-labeling: true

      # Only the lock-sync step below needs these; release-please itself needs
      # neither a checkout nor uv.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != ''
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != ''
        with:
          # No cache: this job has contents:write, and a poisoned cache in a
          # write-privileged workflow is a supply-chain risk (zizmor
          # cache-poisoning).
          enable-cache: false

      # uv.lock records the project's own version, so a release that bumps
      # [project].version leaves it stale and `uv sync --locked` fails.
      # release-please cannot maintain it: `extra-files` would need a jsonpath
      # into an array whose index shifts with every dependency change.
      - name: Sync uv.lock to the released version
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: release-please--branches--main
        run: |
          set -euo pipefail
          # The release branch is deleted when its PR merges, yet a later
          # run can still report an existing PR and satisfy this step's
          # guard. A missing branch means there is nothing to sync — not a
          # failure. Without this the job dies on `git checkout -B` with
          # "not a commit", reddening main.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No $BRANCH on origin — nothing to sync."
            exit 0
          fi
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the released version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock to the released version" -- uv.lock
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
        # No `release-type:` here. Passing it puts the action in non-manifest
        # mode, which ignores release-please-config.json and
        # .release-please-manifest.json — both of which this repo carries.
