repos:
  - repo: local
    hooks:
      - id: robotsix-modules-check
        name: Validate module registration
        entry: uv run robotsix-modules check-registration docs/modules.yaml --root .
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/damien-robotsix/robotsix-standards
    rev: v0.10.0
    hooks:
      - id: check-secret-str
