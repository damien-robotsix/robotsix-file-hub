services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ROBOTSIX_CONFIG_FILE: /home/app/config/config.json
      PYTHONPATH: /home/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    volumes:
      - ./src:/home/app/src
      - ./config/config.docker.json:/home/app/config/config.json
    command:
      - uv
      - run
      - uvicorn
      - robotsix_file_hub.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: file_hub
      POSTGRES_PASSWORD: file_hub
      POSTGRES_DB: file_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_hub -d file_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  volumes:
  postgres_data:
