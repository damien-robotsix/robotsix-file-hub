services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ROBOTSIX_CONFIG_FILE: /home/app/config/config.json
      PYTHONPATH: /home/app/src
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    volumes:
      - ./src:/home/app/src
      - ./config/config.docker.json:/home/app/config/config.json
    command:
      - uv
      - run
      - uvicorn
      - robotsix_file_hub.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: file_hub
      POSTGRES_PASSWORD: file_hub
      POSTGRES_DB: file_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_hub -d file_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage for the "s3" storage backend. config.docker.json points
  # s3_endpoint at http://minio:9000 with these credentials, so the service
  # name and ports here must stay in sync with that file (asserted by
  # tests/core/test_compose_config.py).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job that creates the "file-hub" bucket the backend writes to,
  # then exits. The backend waits for it via service_completed_successfully.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/file-hub
      "

  # Embedding server for the "bge-m3" model. config.docker.json points
  # embedding.endpoint at http://ollama:11434/v1, so this service name and
  # port must stay in sync with that file.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  minio_data:
  ollama_data:
