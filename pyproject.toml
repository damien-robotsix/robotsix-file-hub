[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-file-hub"
version = "0.9.0"
description = "LLM-powered file organization hub"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "robotsix-config @ git+https://github.com/damien-robotsix/robotsix-config.git@feabed320883760ec0f449469870d45f73d87194",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "robotsix-http>=0.1",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "boto3>=1.43.71",
    "httpx>=0.28.0",
    "openpyxl>=3.1.0",
    "pgvector>=0.4.0",
    "pydantic>=2.13.0",
    "pypdf>=6.16.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.19",
    "python-json-logger>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "ba90d55ea2bcbd02f605f392e837cea7b485d73d" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", branch = "main" }

[tool.deptry]
known_first_party = ["robotsix_file_hub"]

[tool.deptry.package_module_name_map]
"python-docx" = "docx"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "aiosqlite",
    "alembic",
    "asyncpg",
    "python-multipart",
    "uvicorn",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.0",
    "mypy-baseline>=0.7.4",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "robotsix-modules>=0.1.0",
    "ruff>=0.16.3",
    "vulture>=2.16",
]

[tool.hatch.metadata]
# robotsix-config is a git dependency (PEP 508 direct reference); hatchling
# rejects those unless explicitly allowed.
allow-direct-references = true
