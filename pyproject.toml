[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-file-hub"
version = "0.1.0"
description = "LLM-powered file organization hub"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sentence-transformers>=3.4.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "boto3>=1.36.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.0",
    "pgvector>=0.4.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.0",
    "mypy-baseline>=0.7.4",
    "ruff>=0.16.0",
    "vulture>=2.16",
]

[tool.deptry.per_rule_ignores]
# Temporary CI-green measure: proper hygiene cleanup tracked in a mill ticket.
# DB drivers / CLI tools are used without direct import; pytest/ruff/mypy live
# in the legacy dev extra; pydantic is imported but currently only transitive.
DEP002 = [
    "aiosqlite", "asyncpg", "uvicorn", "alembic", "python-multipart",
    "pytest", "pytest-asyncio", "ruff", "mypy",
]
DEP003 = ["pydantic"]